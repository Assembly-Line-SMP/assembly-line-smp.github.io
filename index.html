<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Assembly Line SMP</title>
<link rel="stylesheet" href="landing.css" />
</head>
<body>

  <div class="bg-layer bg-default"></div>
  <div class="bg-layer bg-season1"></div>
  <div class="bg-layer bg-season2"></div>
  <div class="bg-overlay"></div>

  <main class="content">
    <div class="hero">
      <h1>Assembly Line SMP</h1>
      <div class="seasons">
        <a class="season" data-season="season1" href="/s1/">
          <span class="badge">1</span>
          <span class="label">Season 1</span>
        </a>
        <a class="season" data-season="season2" href="/s2/">
          <span class="badge">2</span>
          <span class="label">Season 2</span>
        </a>
        <span class="season season--disabled" aria-disabled="true" tabindex="-1">
          <span class="badge">3</span>
          <span class="label">Season 3 (Coming soon!)</span>
        </span>
      </div>
      <a class="suggest-link" href="/suggest/">Suggest a mod →</a>
    </div>

    <nav class="social-links" aria-label="Community links">
      <a class="social-link modrinth" href="https://modrinth.com/server/assembly-line-smp" target="_blank" rel="noopener noreferrer" aria-label="Modrinth">
        <img src="assets/icons/modrinth.webp" alt="Modrinth" />
      </a>
      <a class="social-link discord" href="https://discord.gg/YVzsd3HNqx" target="_blank" rel="noopener noreferrer" aria-label="Discord">
        <img src="assets/icons/discord.webp" alt="Discord" />
      </a>
      <a class="social-link curseforge" href="https://www.curseforge.com/minecraft/modpacks/assembly-line-smp-official-modpack" target="_blank" rel="noopener noreferrer" aria-label="CurseForge">
        <img src="assets/icons/curseforge.webp" alt="CurseForge" />
      </a>
    </nav>
  </main>

  <script src="landing.js"></script>
</body>
</html>
