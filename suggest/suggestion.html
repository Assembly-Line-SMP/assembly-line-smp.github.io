<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Suggestion — Assembly Line SMP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght,ROND@6..144,100..700,100&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />
<link rel="stylesheet" href="./base.css" />
<link rel="stylesheet" href="./suggest.css" />
<link rel="stylesheet" href="./suggestion.css" />
</head>
<body>
<div class="suggest-app suggestion-detail-app">
  <header class="suggest-header">
    <div class="suggest-header__titles">
      <a class="suggestion-back" href="./"><span class="material-symbols-rounded">arrow_back</span> All suggestions</a>
      <h1 class="page-title" id="detail-title">Loading suggestion…</h1>
    </div>
    <div class="suggest-header__actions">
      <button class="icon-button" id="theme-toggle" type="button" aria-label="Toggle dark mode">
        <span class="material-symbols-rounded" id="theme-icon">dark_mode</span>
      </button>
      <div id="auth-area"></div>
    </div>
  </header>

  <main id="detail-content">
    <p class="suggest-empty">Loading…</p>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="./suggestion.js"></script>
</body>
</html>
