<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting…</title>
</head>
<body>
<script>
  (function () {
    const match = window.location.pathname.match(/^\/suggest\/([^/]+)\/?$/);
    if (match) {
      const slug = decodeURIComponent(match[1]);
      if (slug && !["suggestion.html", "index.html"].includes(slug)) {
        window.location.replace(`/suggest/suggestion.html?slug=${encodeURIComponent(slug)}&_=${Date.now()}`);
        return;
      }
    }
    window.location.replace("/suggest/");
  })();
</script>
</body>
</html>
